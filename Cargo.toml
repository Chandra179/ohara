[package]
name = "ohara"
version = "0.1.0"
edition = "2024"
publish = false
description = "Embedded, zero-daemon web scrape → clean → chunk/vectorize → graph extraction → GraphRAG pipeline."
repository = "https://github.com/Chandra179/ohara"
keywords = ["graphrag", "scraping", "rag", "sqlite", "embeddings"]
categories = ["database", "text-processing"]
authors = ["Chandra"]

# Lint policy — docs/CODE_GUIDE.md §5 (C-LINT). Warnings are errors in CI.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all       = { level = "warn", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"   # allowed only with the invariant stated in the message (ARCHITECTURE §10)
panic       = "warn"   # deliberate invariant panics must be visibly reviewed
todo        = "deny"
dbg_macro   = "deny"

# Permitted pedantic exceptions — one-line justification each (CODE_GUIDE §5).
module_name_repetitions = "allow" # plane modules legitimately repeat their plane's name

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "signal", "fs", "macros"] }
toml = "1.1.5"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6335}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb-server:v4.20.4}
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - falkordb_data:/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  falkordb_data:
